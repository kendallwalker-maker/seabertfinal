<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>✨ ELA Quest Zone — 7th Grade Core Skills ✨</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #f5f3ff 0%, #edd8fc 100%);
      --panel-bg: #ffffff;
      --primary-purple: #9333ea;
      --accent-hover: #a855f7;
      --neon-pink: #ff6b9d;
      --mint-green: #2dd4bf;
      --soft-coral: #f97316;
      --text-dark: #1e1b4b;
      --text-muted: #6b7280;
      --shadow-style: 0 12px 24px -4px rgba(147, 51, 234, 0.12), 0 4px 12px -2px rgba(147, 51, 234, 0.06);
    }

    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-dark);
      padding: 1.5rem;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 750px;
    }

    header {
      background: var(--panel-bg);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.25rem 1.5rem;
      border-radius: 1.25rem;
      box-shadow: var(--shadow-style);
      margin-bottom: 1.5rem;
      border: 3px solid #f3e8ff;
    }

    .logo-zone h1 {
      font-size: 1.6rem;
      color: var(--primary-purple);
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .logo-zone p {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 0.1rem;
    }

    .stats-hub {
      display: flex;
      gap: 0.75rem;
    }

    .stat-box {
      background: #faf5ff;
      padding: 0.6rem 1.2rem;
      border-radius: 50px;
      font-weight: 800;
      font-size: 1rem;
      border: 2px solid #e9d5ff;
    }

    #wallet-disp { color: var(--soft-coral); }
    #streak-disp { color: var(--neon-pink); }

    .screen {
      display: none;
      background: var(--panel-bg);
      padding: 2.25rem 2rem;
      border-radius: 1.5rem;
      border: 3px solid #f3e8ff;
      box-shadow: var(--shadow-style);
    }

    .screen.active {
      display: block;
    }

    h2 {
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: 0.5rem;
      color: var(--primary-purple);
    }

    .menu-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.25rem;
      margin-top: 1.5rem;
    }

    @media (max-width: 600px) {
      .menu-grid { grid-template-columns: 1fr; }
    }

    button {
      cursor: pointer;
      font-weight: 700;
      transition: all 0.2s ease;
